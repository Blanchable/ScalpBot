name: SPY EMA Volume Price Action Backtest

on:
  push:
    branches:
      - backtest/spy-ema-volume-price-action-2026-08-22
    paths:
      - ".github/workflows/spy-ema-volume-backtest.yml"
      - "backtest_parts/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/spy-ema-volume-backtest.yml"
      - "backtest_parts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reassemble hash-verified runner
        shell: bash
        run: |
          cat backtest_parts/*.part > backtest_runner.py
          python -m py_compile backtest_runner.py
          sha256sum backtest_runner.py | tee runner_sha256.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Run backtest
        env:
          BACKTEST_OUT: results
        run: python backtest_runner.py | tee run_output.json

      - name: Inventory outputs
        if: always()
        run: |
          find results -maxdepth 1 -type f -printf "%f %s bytes\n" | sort || true

      - name: Upload complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spy-ema-volume-backtest-results
          path: |
            results/**
            run_output.json
            runner_sha256.txt
            backtest_runner.py
          if-no-files-found: warn
          retention-days: 30
